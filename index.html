<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Staff Attendance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;padding-bottom:140px}
/* TOPBAR */
.topbar{background:#fff;border-bottom:1px solid #e5e5e5;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar h1{font-size:17px;font-weight:700}
.topbar .dt{font-size:11px;color:#888;margin-top:2px}
.rep-btn{background:#f0f0f0;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid #e5e5e5}
.stat{text-align:center;padding:4px 0}
.stat-n{font-size:22px;font-weight:700}
.stat-l{font-size:10px;color:#888;margin-top:1px;text-transform:uppercase;font-weight:600}
.np{color:#16a34a}.na{color:#dc2626}.nl{color:#d97706}.nh{color:#2563eb}
/* LEGEND */
.legend{display:flex;gap:6px;padding:8px 16px;background:#fafafa;border-bottom:1px solid #e5e5e5;flex-wrap:wrap}
.leg{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
.lp{background:#dcfce7;color:#166534}.la{background:#fee2e2;color:#991b1b}.ll{background:#fef3c7;color:#92400e}.lh{background:#dbeafe;color:#1e40af}
/* CONTROLS */
.controls{padding:10px 16px;background:#fff;border-bottom:1px solid #e5e5e5;display:flex;gap:8px;align-items:center}
.controls input[type=text]{flex:1;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;background:#fafafa}
.controls input[type=text]:focus{border-color:#16a34a}
.mab{padding:9px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer}
/* STAFF CARDS */
.staff-list{padding:10px 16px}
.sc{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #e8e8e8;border-radius:12px;padding:10px 12px;margin-bottom:6px;transition:border-color .15s,background .15s}
.sc.mk-P{border-color:#86efac;background:#f0fdf4}
.sc.mk-A{border-color:#fca5a5;background:#fff5f5}
.sc.mk-L{border-color:#fcd34d;background:#fffbeb}
.sc.mk-H{border-color:#93c5fd;background:#eff6ff}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.si{flex:1;min-width:0}
.sn{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd{font-size:11px;color:#888;margin-top:1px}
.lt{font-size:11px;color:#d97706;margin-top:2px;font-weight:700}
.bg{display:flex;gap:4px;flex-shrink:0}
.ab{width:36px;height:36px;border-radius:8px;border:1.5px solid #e0e0e0;background:#fafafa;cursor:pointer;font-size:12px;font-weight:700;color:#aaa}
.ab:active{transform:scale(.88)}
.ab.sP{background:#16a34a;border-color:#16a34a;color:#fff}
.ab.sA{background:#dc2626;border-color:#dc2626;color:#fff}
.ab.sL{background:#d97706;border-color:#d97706;color:#fff}
.ab.sH{background:#2563eb;border-color:#2563eb;color:#fff}
/* BOTTOM BAR */
.bot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e5;padding:8px 16px 12px;z-index:10;display:flex;flex-direction:column;gap:6px}
.warn{font-size:12px;color:#dc2626;font-weight:700;text-align:center;display:none;padding:2px 0}
.ph-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f0f0f0}
.ph-label{font-size:13px;font-weight:700;color:#1a1a1a}
.ph-ctrl{display:flex;align-items:center;gap:8px}
.ph-ctrl button{width:34px;height:34px;border-radius:50%;border:2px solid #16a34a;background:#fff;color:#16a34a;font-size:20px;font-weight:700;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
.ph-ctrl button:active{background:#dcfce7}
.ph-ctrl input{width:56px;text-align:center;font-size:18px;font-weight:700;color:#16a34a;border:2px solid #16a34a;border-radius:8px;padding:4px;outline:none}
.btn-row{display:flex;gap:8px}
.save-btn{flex:1;padding:13px;background:#16a34a;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.save-btn:active{background:#15803d}
.hist-btn{padding:13px 16px;background:#f0f0f0;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
/* MODALS */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end}
.ov.open{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding-bottom:20px}
.handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:12px auto 16px}
.mh{padding:0 16px 12px;border-bottom:1px solid #f0f0f0}
.mh h2{font-size:17px;font-weight:700}
.mb{padding:12px 16px}
.close-btn{width:calc(100% - 32px);margin:8px 16px 0;padding:12px;background:#f0f0f0;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
/* REPORT CARDS */
.rc{background:#fafafa;border:1px solid #e8e8e8;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.rc:hover{border-color:#ccc}
.rc-title{font-size:14px;font-weight:700}
.rc-sub{font-size:12px;color:#888;margin-top:3px}
.pills{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.pill{font-size:11px;padding:2px 10px;border-radius:20px;font-weight:700}
.pp{background:#dcfce7;color:#166534}.pa{background:#fee2e2;color:#991b1b}.pl{background:#fef3c7;color:#92400e}.ph{background:#dbeafe;color:#1e40af}
/* TABS */
.tabs{display:flex;gap:0;margin-bottom:14px;border:1px solid #e5e5e5;border-radius:10px;overflow:hidden}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;background:#fff;border:none;color:#888}
.tab.active{background:#16a34a;color:#fff}
/* SUMMARY GRID */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.sb{background:#fafafa;border:1px solid #eee;border-radius:8px;padding:8px 4px;text-align:center}
.sb-n{font-size:20px;font-weight:700}
.sb-l{font-size:10px;color:#888;margin-top:2px;text-transform:uppercase;font-weight:600}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px;background:#f5f5f5;color:#666;font-size:11px;font-weight:700;text-transform:uppercase;border-bottom:1px solid #eee}
.tbl td{padding:8px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bP{background:#dcfce7;color:#166534}.bA{background:#fee2e2;color:#991b1b}.bL{background:#fef3c7;color:#92400e}.bH{background:#dbeafe;color:#1e40af}.bX{background:#f5f5f5;color:#aaa}
/* BUTTONS */
.wa-btn{width:100%;padding:13px;background:#25D366;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.pdf-day-btn{width:100%;padding:12px;background:#1e40af;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px}
.pdf-mon-btn{width:100%;padding:12px;background:#7c3aed;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px}
.back-btn{width:100%;padding:12px;background:#f0f0f0;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.month-pdf-btn{padding:8px 14px;background:#7c3aed;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.ms{display:flex;gap:8px;margin-bottom:14px;align-items:center}
.ms select{flex:1;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fff;outline:none}
.empty{text-align:center;padding:32px;color:#aaa;font-size:14px}
/* LATE POPUP */
.pop-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.pop-ov.open{display:flex}
.pop-box{background:#fff;border-radius:16px;padding:24px;width:280px;text-align:center}
.pop-box h3{font-size:16px;font-weight:700;margin-bottom:6px}
.pop-box p{font-size:13px;color:#888;margin-bottom:14px}
.pop-box input{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:22px;font-weight:700;text-align:center;outline:none;letter-spacing:2px}
.pop-box input:focus{border-color:#d97706}
.pop-btns{display:flex;gap:8px;margin-top:14px}
.pop-btns button{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.pc{background:#d97706;color:#fff}.pcan{background:#f0f0f0;color:#1a1a1a}
/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.load-bar{position:fixed;top:0;left:0;right:0;height:3px;background:#16a34a;z-index:9999;display:none}
.load-bar.show{display:block;animation:lb 1.2s infinite}
@keyframes lb{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
</style>
</head>
<body>
<div class="load-bar" id="loadBar"></div>

<div class="topbar">
  <div><h1>📅 Attendance</h1><div class="dt" id="dtLabel"></div></div>
  <div style="display:flex;gap:8px;align-items:center">
    <input type="date" id="datePicker" style="padding:6px 10px;border:1.5px solid #16a34a;border-radius:8px;font-size:13px;font-weight:600;color:#16a34a;outline:none;cursor:pointer" onchange="changeDate(this.value)">
    <button class="rep-btn" onclick="syncFromSheets()" style="background:#dcfce7;color:#166534">🔄</button>
    <button class="rep-btn" onclick="openReports()">📋</button>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n np" id="cP">0</div><div class="stat-l">Present</div></div>
  <div class="stat"><div class="stat-n na" id="cA">0</div><div class="stat-l">Absent</div></div>
  <div class="stat"><div class="stat-n nl" id="cL">0</div><div class="stat-l">Late</div></div>
  <div class="stat"><div class="stat-n nh" id="cH">0</div><div class="stat-l">Half-day</div></div>
</div>

<div class="legend">
  <span class="leg lp">P = Present</span>
  <span class="leg la">A = Absent</span>
  <span class="leg ll">L = Late</span>
  <span class="leg lh">H = Half-day</span>
</div>
<div id="dateBanner" style="display:none;background:#fef3c7;color:#92400e;padding:10px 16px;font-size:13px;font-weight:700;border-bottom:1px solid #fcd34d;text-align:center"></div>

<div class="controls">
  <input type="text" id="srch" placeholder="Search name or dept..." oninput="renderGrid()">
  <button class="mab" onclick="markAll('P')">All P</button>
  <button class="mab" onclick="markAll('A')">All A</button>
</div>

<div class="staff-list" id="grid"></div>

<div class="bot">
  <div class="warn" id="warnMsg"></div>
  <div class="ph-row">
    <span class="ph-label">📱 Phones Today</span>
    <div class="ph-ctrl">
      <button onclick="chPhone(-1)">−</button>
      <input type="number" id="phInp" value="0" min="0" oninput="phones=parseInt(this.value)||0">
      <button onclick="chPhone(1)">+</button>
    </div>
  </div>
  <div class="btn-row">
    <button class="save-btn" onclick="save()">✓ Save Attendance</button>
    <button class="hist-btn" onclick="openReports()">📋</button>
  </div>
</div>

<!-- Late Popup -->
<div class="pop-ov" id="latePop">
  <div class="pop-box">
    <h3>⏰ Late Entry</h3>
    <p id="lateFor"></p>
    <input type="text" id="lateInp" placeholder="10:35" maxlength="5" oninput="fmtT(this)">
    <div class="pop-btns">
      <button class="pcan" onclick="cancelLate()">Cancel</button>
      <button class="pc" onclick="confirmLate()">Save</button>
    </div>
  </div>
</div>

<!-- Reports Modal -->
<div class="ov" id="repMod" onclick="bgClose(event,'repMod')">
  <div class="sheet">
    <div class="handle"></div>
    <div class="mh"><h2>📋 Reports</h2></div>
    <div class="mb">
      <div class="tabs">
        <button class="tab active" id="tab-day" onclick="switchTab('day')">📅 Day Wise</button>
        <button class="tab" id="tab-month" onclick="switchTab('month')">📆 Monthly</button>
      </div>
      <div id="tab-day-content"></div>
      <div id="tab-month-content" style="display:none"></div>
    </div>
    <button class="close-btn" onclick="closeM('repMod')">Close</button>
  </div>
</div>

<!-- Day Detail Modal -->
<div class="ov" id="dayMod" onclick="bgClose(event,'dayMod')">
  <div class="sheet">
    <div class="handle"></div>
    <div class="mh"><h2 id="dayTitle"></h2></div>
    <div class="mb">
      <div class="sg" id="daySummary"></div>
      <table class="tbl">
        <thead><tr><th>#</th><th>Name</th><th>Dept</th><th>Status</th><th>Time</th></tr></thead>
        <tbody id="dayTable"></tbody>
      </table>
      <br>
      <button class="pdf-day-btn" onclick="pdfDay()">⬇ Download Day PDF</button>
      <button class="wa-btn" onclick="waDay()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Share on WhatsApp
      </button>
      <button class="back-btn" onclick="closeM('dayMod');openReports()">← Back</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzcZPNXfFU8wLakQRl71JSgsy69gFZmTjpJB36hhtj5VT4dz6cfsE6zjXvvthFMwRin/exec';
const LS_KEY='att_v3';

const STAFF=[
  {id:1,name:"VIJAY",dept:"COMPUTER",c:"#dcfce7",t:"#166534"},
  {id:2,name:"LUNSINGH",dept:"DOORMAT",c:"#fef3c7",t:"#92400e"},
  {id:3,name:"RANJIT",dept:"D/B",c:"#dbeafe",t:"#1e40af"},
  {id:4,name:"NIRANJAN",dept:"D/B",c:"#fee2e2",t:"#991b1b"},
  {id:5,name:"PRITESH",dept:"D/B",c:"#dcfce7",t:"#166534"},
  {id:6,name:"PREM",dept:"D/B",c:"#fef3c7",t:"#92400e"},
  {id:7,name:"SAURABH",dept:"D/B",c:"#f3e8ff",t:"#6b21a8"},
  {id:8,name:"AKHILESH",dept:"D/B",c:"#dbeafe",t:"#1e40af"},
  {id:9,name:"JATIN",dept:"S/B",c:"#fee2e2",t:"#991b1b"},
  {id:10,name:"SANKET",dept:"S/B",c:"#dcfce7",t:"#166534"},
  {id:11,name:"MAHESH",dept:"S/B",c:"#f3e8ff",t:"#6b21a8"},
  {id:12,name:"ASHOK",dept:"TOWEL",c:"#fce7f3",t:"#9d174d"},
  {id:13,name:"NILESH",dept:"TOWEL",c:"#dbeafe",t:"#1e40af"},
  {id:14,name:"AKUL",dept:"TOWEL",c:"#dcfce7",t:"#166534"},
  {id:15,name:"MAHESH",dept:"C/C",c:"#fee2e2",t:"#991b1b"},
  {id:16,name:"SHAKTI",dept:"C/C",c:"#f3e8ff",t:"#6b21a8"},
  {id:17,name:"NARESH",dept:"C/C",c:"#fce7f3",t:"#9d174d"},
  {id:18,name:"RAMBHAI",dept:"CURTAINS",c:"#dbeafe",t:"#1e40af"},
  {id:19,name:"JIGAR",dept:"CURTAINS",c:"#dcfce7",t:"#166534"},
  {id:20,name:"RAJU",dept:"CURTAINS",c:"#fef3c7",t:"#92400e"},
  {id:21,name:"NARENDRA",dept:"CURTAINS",c:"#fee2e2",t:"#991b1b"},
  {id:22,name:"BHARAT",dept:"CURTAINS",c:"#fce7f3",t:"#9d174d"},
  {id:23,name:"MANOHAR",dept:"CURTAINS",c:"#f3e8ff",t:"#6b21a8"},
  {id:24,name:"JAY",dept:"SOFA",c:"#dbeafe",t:"#1e40af"},
  {id:25,name:"TIRTH",dept:"SOFA",c:"#dcfce7",t:"#166534"},
  {id:26,name:"VEERPAL",dept:"SOFA",c:"#fef3c7",t:"#92400e"},
  {id:27,name:"RAJ",dept:"CURTAINS",c:"#fee2e2",t:"#991b1b"},
  {id:28,name:"DINESH",dept:"CURTAINS",c:"#fce7f3",t:"#9d174d"},
  {id:29,name:"KANIYALAL",dept:"LIFTMAN",c:"#dbeafe",t:"#1e40af"},
  {id:30,name:"AJAY",dept:"TAILOR",c:"#f3e8ff",t:"#6b21a8"},
  {id:31,name:"VEERSINGH",dept:"TAILOR",c:"#dcfce7",t:"#166534"},
  {id:32,name:"VINODJI",dept:"D/B",c:"#fef3c7",t:"#92400e"}
];

// STATE
let att={}, late={}, phones=0, pendingLateId=null, viewDay=null, curTab='day', selectedDate=null;

// ── STORAGE: localStorage as primary, Sheets as backup ──
function lsLoad(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    return raw?JSON.parse(raw):{};
  }catch(e){return {};}
}
function lsSave(db){
  try{localStorage.setItem(LS_KEY,JSON.stringify(db));}catch(e){}
}
function getDB(){return lsLoad();}
function todayKey(){return selectedDate||new Date().toISOString().slice(0,10);}
function isToday(){return todayKey()===new Date().toISOString().slice(0,10);}
function fmtDate(){const d=selectedDate?new Date(selectedDate+'T00:00:00'):new Date();return d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function fmtTime(){return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});}
function ini(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function fmtT(inp){let v=inp.value.replace(/\D/g,'');if(v.length>=3)v=v.slice(0,2)+':'+v.slice(2,4);inp.value=v;}
function chPhone(d){phones=Math.max(0,phones+d);document.getElementById('phInp').value=phones;}

// ── CHANGE DATE ──
function changeDate(val){
  selectedDate=val;
  att={};late={};phones=0;
  document.getElementById('phInp').value=0;
  document.getElementById('dtLabel').textContent=fmtDate();
  // show banner if past date
  const banner=document.getElementById('dateBanner');
  if(!isToday()){
    banner.style.display='block';
    const d=new Date(val+'T00:00:00');
    banner.textContent='📅 Editing: '+d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  } else {
    banner.style.display='none';
  }
  loadToday();
}

// ── LOAD DATE DATA from localStorage ──
function loadToday(){
  const db=getDB();
  const tk=todayKey();
  if(db[tk]){
    att={...db[tk].att};

// ── SYNC FROM GOOGLE SHEETS ──
function parseSheetDate(raw){
  // Handles: "2026-07-31T18:30:00.000Z", "2026-08-01", "2026-07-31T00:00:00"
  // Google Sheets stores dates in UTC, we need IST date (UTC+5:30)
  if(!raw)return null;
  const s=String(raw).trim();
  if(s.includes('T')||s.includes('Z')){
    // Parse as UTC and convert to IST
    const d=new Date(s);
    // Add 5h30m to get IST
    const ist=new Date(d.getTime()+(5.5*60*60*1000));
    return ist.toISOString().slice(0,10);
  }
  return s.slice(0,10);
}

function processSheetData(json){
  try{
    if(!json||json.status!=='success'||!json.data||json.data.length<2){
      showToast('⚠ No data in sheet yet');
      return;
    }
    const rows=json.data.slice(1);
    const db=getDB();
    let count=0;
    rows.forEach(row=>{
      const date=parseSheetDate(row[0]);
      const staffId=parseInt(row[1]);
      const status=String(row[4]||'').trim();
      const lateTime=String(row[5]||'').trim();
      const savedAt=String(row[6]||'').trim();
      const ph=parseInt(row[7])||0;
      if(!date||date.length!==10||!staffId)return;
      if(!db[date]){
        const d=new Date(date+'T00:00:00');
        db[date]={
          date,
          label:d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),
          savedAt,att:{},late:{},phones:ph
        };
      }
      if(status){db[date].att[staffId]=status;count++;}
      // Filter invalid Google Sheets date values for empty time
      const validLate=lateTime&&!lateTime.includes('1899')&&!lateTime.includes('T')&&lateTime.length<=5;
      if(validLate)db[date].late[staffId]=lateTime;
      if(ph>0)db[date].phones=ph;
      if(savedAt&&!db[date].savedAt)db[date].savedAt=savedAt;
    });
    lsSave(db);
    loadToday();
    showToast('✓ Synced! '+count+' records loaded');
  }catch(e){showToast('⚠ Sync error: '+e.message);}
}

function syncFromSheets(){
  setLoad(true);
  // Remove old script if exists
  const old=document.getElementById('gs_sc');
  if(old)old.remove();

  const cbName='gs_cb_'+Date.now();
  const timer=setTimeout(()=>{
    delete window[cbName];
    const s=document.getElementById('gs_sc');
    if(s)s.remove();
    setLoad(false);
    showToast('⚠ Timeout — check internet');
  },15000);

  window[cbName]=function(json){
    clearTimeout(timer);
    delete window[cbName];
    const s=document.getElementById('gs_sc');
    if(s)s.remove();
    setLoad(false);
    processSheetData(json);
  };

  const sc=document.createElement('script');
  sc.id='gs_sc';
  sc.src=SCRIPT_URL+'?action=get&callback='+cbName+'&nocache='+Date.now();
  sc.onerror=function(){
    clearTimeout(timer);
    delete window[cbName];
    setLoad(false);
    showToast('⚠ Cannot reach server — check internet');
  };
  document.head.appendChild(sc);
}

function mark(id,status){
  if(status==='L'){
    if(att[id]==='L'){delete att[id];delete late[id];renderStats();renderGrid();return;}
    pendingLateId=id;
    const s=STAFF.find(x=>x.id===id);
    document.getElementById('lateFor').textContent=s.name+' — Entry time?';
    document.getElementById('lateInp').value=late[id]||'';
    document.getElementById('latePop').classList.add('open');
    setTimeout(()=>document.getElementById('lateInp').focus(),100);
    return;
  }
  att[id]=att[id]===status?'':status;
  if(att[id]!=='L')delete late[id];
  renderStats();renderGrid();
}
function markAll(s){STAFF.forEach(x=>{att[x.id]=s;if(s!=='L')delete late[x.id];});renderStats();renderGrid();}
function confirmLate(){
  const t=document.getElementById('lateInp').value.trim();
  if(t&&!/^\d{1,2}:\d{2}$/.test(t)){alert('Format: HH:MM  e.g. 10:35');return;}
  att[pendingLateId]='L';late[pendingLateId]=t||'';
  document.getElementById('latePop').classList.remove('open');
  pendingLateId=null;renderStats();renderGrid();
}
function cancelLate(){
  document.getElementById('latePop').classList.remove('open');

// ── SAVE ──
let editConfirmed = false;

async function save(){
  // Check all marked
  const unm=STAFF.filter(s=>!att[s.id]);
  if(unm.length>0){
    const w=document.getElementById('warnMsg');
    w.style.display='block';
    w.textContent='⚠ '+unm.length+' unmarked: '+unm.slice(0,3).map(s=>s.name).join(', ')+(unm.length>3?'...':'');
    setTimeout(()=>{w.style.display='none';},4000);
    document.getElementById('srch').value='';renderGrid();
    return;
  }

  const tk=todayKey(), db=getDB();

  // Check if today already saved
  if(db[tk] && !editConfirmed){
    const w=document.getElementById('warnMsg');
    w.style.display='block';
    w.innerHTML='⚠ Aaj ka data already saved hai! &nbsp;<button onclick="confirmEdit()" style="background:#dc2626;color:#fff;border:none;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer">Fir bhi Save karo</button>';
    return;
  }

  editConfirmed=false;
  const savedAt=fmtTime();

  // 1. Save to localStorage FIRST
  db[tk]={date:tk,label:fmtDate(),savedAt,att:{...att},late:{...late},phones};
  lsSave(db);
  showToast('✓ Saved!');

  // Hide warning
  const w=document.getElementById('warnMsg');
  w.style.display='none';

  // 2. Backup to Google Sheets
  setLoad(true);
  try{
    const records=STAFF.map(s=>({
      date:tk,staffId:s.id,name:s.name,dept:s.dept,
      status:att[s.id]||'',lateTime:late[s.id]||'',savedAt,phones
    }));
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'save',records,phones,date:tk})
    });
  }catch(e){}
  setLoad(false);
}

function confirmEdit(){
  editConfirmed=true;
  const w=document.getElementById('warnMsg');
  w.style.display='none';
  save();
}

      doc.setTextColor(...(stTc[st]||stTc['-']));doc.setFontSize(6.5);doc.setFont(undefined,'bold');
      doc.text(st,mg+76.5,y2+4,{align:'center'});

      doc.setTextColor(217,119,6);doc.setFontSize(7);doc.setFont(undefined,'normal');
      doc.text(lt,mg+96,y2+4);
      doc.setTextColor(109,40,217);doc.text(String(ph),mg+130,y2+4);
      y2+=6;
      if(y2>ph-18){doc.addPage();y2=14;}
    });

    doc.setDrawColor(200,200,200);doc.line(mg,ph-12,pw-mg,ph-12);
    doc.setTextColor(150,150,150);doc.setFontSize(7);doc.setFont(undefined,'normal');
    doc.text('Generated: '+new Date().toLocaleString('en-IN'),mg,ph-7);
    doc.text('Page '+(si+1)+' of '+STAFF.length,pw-mg,ph-7,{align:'right'});
  });

  openPDF(doc, 'Monthly_Attendance_'+monthLabel.replace(' ','_')+'.pdf');
}

function openM(id){document.getElementById(id).style.display='flex';document.body.style.overflow='hidden';}
function closeM(id){document.getElementById(id).style.display='none';document.body.style.overflow='';}
function bgClose(e,id){if(e.target===document.getElementById(id))closeM(id);}
function setLoad(v){document.getElementById('loadBar').classList.toggle('show',v);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// ── PDF OPEN (works on iOS Safari too) ──
function openPDF(doc, filename){
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if(isIOS){
    // iOS: open in new tab so user can share/save via Safari
    const blob = doc.output('blob');
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    showToast('✓ PDF khul gayi! Share se Save karo');
  } else {
    doc.save(filename);
    showToast('✓ PDF Downloaded!');
  }
}
