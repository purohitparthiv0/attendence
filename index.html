<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Staff Attendance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;padding-bottom:130px}
.topbar{background:#fff;border-bottom:1px solid #e5e5e5;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar h1{font-size:16px;font-weight:700}
.topbar .dt{font-size:11px;color:#888;margin-top:2px}
.top-right{display:flex;gap:6px;align-items:center}
.date-btn{padding:6px 10px;border:2px solid #16a34a;border-radius:8px;font-size:12px;font-weight:700;color:#16a34a;background:#fff;cursor:pointer;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.sync-btn{background:#f0fdf4;border-color:#86efac;color:#16a34a}
.rep-btn2{background:#fff;border-color:#e5e5e5;color:#1a1a1a}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 14px;background:#fff;border-bottom:1px solid #e5e5e5}
.stat{text-align:center}
.stat-n{font-size:22px;font-weight:700}
.stat-l{font-size:10px;color:#888;margin-top:1px;text-transform:uppercase;font-weight:600}
.np{color:#16a34a}.na{color:#dc2626}.nl{color:#d97706}.nh{color:#2563eb}
.legend{display:flex;gap:6px;padding:8px 14px;background:#fafafa;border-bottom:1px solid #e5e5e5;flex-wrap:wrap}
.leg{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
.lp{background:#dcfce7;color:#166534}.la{background:#fee2e2;color:#991b1b}.ll{background:#fef3c7;color:#92400e}.lh{background:#dbeafe;color:#1e40af}
.edit-banner{display:none;background:#fef3c7;color:#92400e;padding:8px 14px;font-size:13px;font-weight:700;border-bottom:1px solid #fcd34d;text-align:center}
.controls{padding:10px 14px;background:#fff;border-bottom:1px solid #e5e5e5;display:flex;gap:8px;align-items:center}
.controls input{flex:1;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;background:#fafafa}
.controls input:focus{border-color:#16a34a}
.mab{padding:9px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:#1a1a1a}
.staff-list{padding:10px 14px}
.sc{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #e8e8e8;border-radius:12px;padding:10px 12px;margin-bottom:6px}
.sc.mk-P{border-color:#86efac;background:#f0fdf4}
.sc.mk-A{border-color:#fca5a5;background:#fff5f5}
.sc.mk-L{border-color:#fcd34d;background:#fffbeb}
.sc.mk-H{border-color:#93c5fd;background:#eff6ff}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.si{flex:1;min-width:0}
.sn{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd{font-size:11px;color:#888;margin-top:1px}
.lt{font-size:11px;color:#d97706;margin-top:2px;font-weight:700}
.bg{display:flex;gap:4px;flex-shrink:0}
.ab{width:34px;height:34px;border-radius:8px;border:1.5px solid #e0e0e0;background:#fafafa;cursor:pointer;font-size:12px;font-weight:700;color:#aaa;display:flex;align-items:center;justify-content:center}
.ab.sP{background:#16a34a;border-color:#16a34a;color:#fff}
.ab.sA{background:#dc2626;border-color:#dc2626;color:#fff}
.ab.sL{background:#d97706;border-color:#d97706;color:#fff}
.ab.sH{background:#2563eb;border-color:#2563eb;color:#fff}
.bot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e5;padding:8px 14px 12px;z-index:10}
.warn{font-size:12px;color:#dc2626;font-weight:700;text-align:center;display:none;padding:3px 0 5px}
.ph-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0f0f0;margin-bottom:6px}
.ph-label{font-size:13px;font-weight:700}
.ph-ctrl{display:flex;align-items:center;gap:8px}
.ph-ctrl .ph-btn{width:34px;height:34px;border-radius:50%;border:2px solid #16a34a;background:#fff;color:#16a34a;font-size:22px;font-weight:400;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;-webkit-appearance:none;appearance:none}
.ph-ctrl input{width:54px;text-align:center;font-size:18px;font-weight:700;color:#16a34a;border:2px solid #16a34a;border-radius:8px;padding:4px;outline:none;-webkit-appearance:none}
.btn-row{display:flex;gap:8px}
.save-btn{flex:1;padding:13px;background:#16a34a;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;-webkit-appearance:none}
.save-btn:active{background:#15803d}
.hist-btn{padding:13px 16px;background:#f0f0f0;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;color:#1a1a1a;-webkit-appearance:none;white-space:nowrap}
/* MODALS */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;justify-content:flex-end;flex-direction:column}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:14px auto 12px}
.mh{padding:0 16px 12px;border-bottom:1px solid #f0f0f0}
.mh h2{font-size:17px;font-weight:700}
.mb{padding:12px 16px}
.close-btn{display:block;width:calc(100% - 32px);margin:8px 16px 16px;padding:13px;background:#f0f0f0;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;-webkit-appearance:none}
.rc{background:#fafafa;border:1px solid #e8e8e8;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.rc:active{background:#f0f0f0}
.rc-title{font-size:14px;font-weight:700}
.rc-sub{font-size:12px;color:#888;margin-top:3px}
.pills{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.pill{font-size:11px;padding:2px 10px;border-radius:20px;font-weight:700}
.pp{background:#dcfce7;color:#166534}.pa{background:#fee2e2;color:#991b1b}.pl{background:#fef3c7;color:#92400e}.ph2{background:#dbeafe;color:#1e40af}
.tabs{display:flex;border:1px solid #e5e5e5;border-radius:10px;overflow:hidden;margin-bottom:14px}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;background:#fff;border:none;color:#888;-webkit-appearance:none}
.tab.active{background:#16a34a;color:#fff}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.sb{background:#fafafa;border:1px solid #eee;border-radius:8px;padding:8px 4px;text-align:center}
.sb-n{font-size:20px;font-weight:700}
.sb-l{font-size:10px;color:#888;margin-top:2px;text-transform:uppercase;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px;background:#f5f5f5;color:#666;font-size:11px;font-weight:700;text-transform:uppercase;border-bottom:1px solid #eee}
.tbl td{padding:7px 8px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bP{background:#dcfce7;color:#166534}.bA{background:#fee2e2;color:#991b1b}.bL{background:#fef3c7;color:#92400e}.bH{background:#dbeafe;color:#1e40af}.bX{background:#f5f5f5;color:#aaa}
.action-btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;text-align:center;margin-bottom:8px;-webkit-appearance:none}
.wa-btn{background:#25D366;color:#fff}
.pdf-btn{background:#1e40af;color:#fff}
.pdf-mon-btn{background:#7c3aed;color:#fff}
.back-btn2{background:#f0f0f0;color:#1a1a1a}
.month-dl-btn{padding:8px 14px;background:#7c3aed;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px;display:block;width:100%;-webkit-appearance:none}
.empty{text-align:center;padding:32px;color:#aaa;font-size:14px}
.pop-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.pop-box{background:#fff;border-radius:16px;padding:24px;width:80%;max-width:300px;text-align:center}
.pop-box h3{font-size:16px;font-weight:700;margin-bottom:6px}
.pop-box p{font-size:13px;color:#888;margin-bottom:14px}
.pop-inp{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:22px;font-weight:700;text-align:center;outline:none;letter-spacing:2px;-webkit-appearance:none}
.pop-inp:focus{border-color:#d97706}
.pop-btns{display:flex;gap:8px;margin-top:14px}
.pop-btns button{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none}
.pop-ok{background:#d97706;color:#fff}
.pop-no{background:#f0f0f0;color:#1a1a1a}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;white-space:nowrap}
.toast.show{opacity:1}
.loadbar{position:fixed;top:0;left:0;right:0;height:3px;background:#16a34a;z-index:9999;display:none;animation:lb 1s infinite}
@keyframes lb{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
</style>
</head>
<body>
<div class="loadbar" id="loadbar"></div>

<div class="topbar">
  <div>
    <h1>&#128197; Attendance</h1>
    <div class="dt" id="dtLabel"></div>
  </div>
  <div class="top-right">
    <input type="date" id="datePicker" class="date-btn" onchange="changeDate(this.value)" style="border:2px solid #16a34a;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;color:#16a34a;background:#fff;cursor:pointer;-webkit-appearance:none;outline:none">
    <button class="icon-btn sync-btn" onclick="syncFromSheets()">&#x21bb;</button>
    <button class="icon-btn rep-btn2" onclick="openReports()">&#128203;</button>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n np" id="cP">0</div><div class="stat-l">Present</div></div>
  <div class="stat"><div class="stat-n na" id="cA">0</div><div class="stat-l">Absent</div></div>
  <div class="stat"><div class="stat-n nl" id="cL">0</div><div class="stat-l">Late</div></div>
  <div class="stat"><div class="stat-n nh" id="cH">0</div><div class="stat-l">Half-day</div></div>
</div>

<div class="legend">
  <span class="leg lp">P = Present</span>
  <span class="leg la">A = Absent</span>
  <span class="leg ll">L = Late</span>
  <span class="leg lh">H = Half-day</span>
</div>

<div class="edit-banner" id="editBanner"></div>

<div class="controls">
  <input type="text" id="srch" placeholder="Search name or dept..." oninput="renderGrid()">
  <button class="mab" onclick="markAll('P')">All P</button>
  <button class="mab" onclick="markAll('A')">All A</button>
</div>

<div class="staff-list" id="grid"></div>

<div class="bot">
  <div class="warn" id="warnMsg"></div>
  <div class="ph-row">
    <span class="ph-label">&#128241; Phones Today</span>
    <div class="ph-ctrl">
      <button class="ph-btn" onclick="chPhone(-1)">&#8722;</button>
      <input type="number" id="phInp" value="0" min="0" oninput="phones=parseInt(this.value)||0">
      <button class="ph-btn" onclick="chPhone(1)">&#43;</button>
    </div>
  </div>
  <div class="btn-row">
    <button class="save-btn" onclick="doSave()">&#10003; Save Attendance</button>
    <button class="hist-btn" onclick="openReports()">&#128203; Reports</button>
  </div>
</div>

<!-- Late Popup -->
<div class="pop-ov" id="latePop" style="display:none">
  <div class="pop-box">
    <h3>&#9200; Late Entry</h3>
    <p id="lateFor">Entry time?</p>
    <input class="pop-inp" type="text" id="lateInp" placeholder="10:35" maxlength="5" oninput="fmtT(this)">
    <div class="pop-btns">
      <button class="pop-no" onclick="cancelLate()">Cancel</button>
      <button class="pop-ok" onclick="confirmLate()">Save</button>
    </div>
  </div>
</div>

<!-- Reports Modal -->
<div class="ov" id="repMod">
  <div class="sheet">
    <div class="handle"></div>
    <div class="mh"><h2>&#128203; Reports</h2></div>
    <div class="mb">
      <div class="tabs">
        <button class="tab active" id="tab-day" onclick="switchTab('day')">Day Wise</button>
        <button class="tab" id="tab-month" onclick="switchTab('month')">Monthly</button>
      </div>
      <div id="tab-day-content"></div>
      <div id="tab-month-content" style="display:none"></div>
    </div>
    <button class="close-btn" onclick="closeM('repMod')">Close</button>
  </div>
</div>

<!-- Day Detail Modal -->
<div class="ov" id="dayMod">
  <div class="sheet">
    <div class="handle"></div>
    <div class="mh"><h2 id="dayTitle"></h2></div>
    <div class="mb">
      <div class="sg" id="daySummary"></div>
      <table class="tbl">
        <thead><tr><th>#</th><th>Name</th><th>Dept</th><th>Status</th><th>Time</th></tr></thead>
        <tbody id="dayTable"></tbody>
      </table>
      <br>
      <button class="action-btn pdf-btn" onclick="pdfDay()">Download Day PDF</button>
      <button class="action-btn wa-btn" onclick="waDay()">&#128241; Share on WhatsApp</button>
      <button class="action-btn back-btn2" onclick="closeM('dayMod');openReports()">&#8592; Back</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbznNrIwFbFFA8oXygdQOXx_uI4V-nglrg5B5bSoSJgN8jbz9_S3y0jtdobfhL9dDV6r/exec';
const LS='att_v4';

const STAFF=[
  {id:1,name:"VIJAY",dept:"COMPUTER",c:"#dcfce7",t:"#166534"},
  {id:2,name:"LUNSINGH",dept:"DOORMAT",c:"#fef3c7",t:"#92400e"},
  {id:3,name:"RANJIT",dept:"D/B",c:"#dbeafe",t:"#1e40af"},
  {id:4,name:"NIRANJAN",dept:"D/B",c:"#fee2e2",t:"#991b1b"},
  {id:5,name:"PRITESH",dept:"D/B",c:"#dcfce7",t:"#166534"},
  {id:6,name:"PREM",dept:"D/B",c:"#fef3c7",t:"#92400e"},
  {id:7,name:"SAURABH",dept:"D/B",c:"#f3e8ff",t:"#6b21a8"},
  {id:8,name:"AKHILESH",dept:"D/B",c:"#dbeafe",t:"#1e40af"},
  {id:9,name:"JATIN",dept:"S/B",c:"#fee2e2",t:"#991b1b"},
  {id:10,name:"SANKET",dept:"S/B",c:"#dcfce7",t:"#166534"},
  {id:11,name:"MAHESH",dept:"S/B",c:"#f3e8ff",t:"#6b21a8"},
  {id:12,name:"ASHOK",dept:"TOWEL",c:"#fce7f3",t:"#9d174d"},
  {id:13,name:"NILESH",dept:"TOWEL",c:"#dbeafe",t:"#1e40af"},
  {id:14,name:"AKUL",dept:"TOWEL",c:"#dcfce7",t:"#166534"},
  {id:15,name:"MAHESH",dept:"C/C",c:"#fee2e2",t:"#991b1b"},
  {id:16,name:"SHAKTI",dept:"C/C",c:"#f3e8ff",t:"#6b21a8"},
  {id:17,name:"NARESH",dept:"C/C",c:"#fce7f3",t:"#9d174d"},
  {id:18,name:"RAMBHAI",dept:"CURTAINS",c:"#dbeafe",t:"#1e40af"},
  {id:19,name:"JIGAR",dept:"CURTAINS",c:"#dcfce7",t:"#166534"},
  {id:20,name:"RAJU",dept:"CURTAINS",c:"#fef3c7",t:"#92400e"},
  {id:21,name:"NARENDRA",dept:"CURTAINS",c:"#fee2e2",t:"#991b1b"},
  {id:22,name:"BHARAT",dept:"CURTAINS",c:"#fce7f3",t:"#9d174d"},
  {id:23,name:"MANOHAR",dept:"CURTAINS",c:"#f3e8ff",t:"#6b21a8"},
  {id:24,name:"JAY",dept:"SOFA",c:"#dbeafe",t:"#1e40af"},
  {id:25,name:"TIRTH",dept:"SOFA",c:"#dcfce7",t:"#166534"},
  {id:26,name:"VEERPAL",dept:"SOFA",c:"#fef3c7",t:"#92400e"},
  {id:27,name:"RAJ",dept:"CURTAINS",c:"#fee2e2",t:"#991b1b"},
  {id:28,name:"DINESH",dept:"CURTAINS",c:"#fce7f3",t:"#9d174d"},
  {id:29,name:"KANIYALAL",dept:"LIFTMAN",c:"#dbeafe",t:"#1e40af"},
  {id:30,name:"AJAY",dept:"TAILOR",c:"#f3e8ff",t:"#6b21a8"},
  {id:31,name:"VEERSINGH",dept:"TAILOR",c:"#dcfce7",t:"#166534"},
  {id:32,name:"VINODJI",dept:"D/B",c:"#fef3c7",t:"#92400e"}
];

let att={},late={},phones=0,pendingLateId=null,viewDayKey=null,curTab='day',editConfirmed=false,selDate=null;

function getDB(){try{const r=localStorage.getItem(LS);return r?JSON.parse(r):{}}catch(e){return {}}}
function saveDB(db){try{localStorage.setItem(LS,JSON.stringify(db))}catch(e){}}
function todayStr(){return new Date().toISOString().slice(0,10)}
function curKey(){return selDate||todayStr()}
function isToday(){return curKey()===todayStr()}
function fmtKey(k){return new Date(k+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function fmtTimeNow(){return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})}
function ini(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
function fmtT(inp){let v=inp.value.replace(/\D/g,'');if(v.length>=3)v=v.slice(0,2)+':'+v.slice(2,4);inp.value=v}
function chPhone(d){phones=Math.max(0,phones+d);document.getElementById('phInp').value=phones}
function setLoad(v){document.getElementById('loadbar').style.display=v?'block':'none'}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

function openM(id){
  const el=document.getElementById(id);
  el.style.display='flex';
  document.body.style.overflow='hidden';
}
function closeM(id){
  document.getElementById(id).style.display='none';
  document.body.style.overflow='';
}

// ── DATE ──
function changeDate(v){
  selDate=v;
  att={};late={};phones=0;
  document.getElementById('phInp').value=0;
  editConfirmed=false;
  const d=new Date(v+'T00:00:00');
  const label=d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  document.getElementById('dtLabel').textContent=fmtKey(v);
  const banner=document.getElementById('editBanner');
  if(!isToday()){
    banner.style.display='block';
    banner.textContent='Editing: '+fmtKey(v);
  } else {
    banner.style.display='none';
  }
  loadCurDate();
}

function loadCurDate(){
  const db=getDB();
  const k=curKey();
  if(db[k]){
    att={...db[k].att};
    late={...db[k].late};
    phones=db[k].phones||0;
    document.getElementById('phInp').value=phones;
  } else {
    att={};late={};phones=0;
    document.getElementById('phInp').value=0;
  }
  renderStats();renderGrid();
}

// ── RENDER ──
function renderStats(){
  const c={P:0,A:0,L:0,H:0};
  Object.values(att).forEach(v=>{if(c[v]!==undefined)c[v]++});
  ['P','A','L','H'].forEach(k=>{document.getElementById('c'+k).textContent=c[k]});
}

function renderGrid(){
  const q=document.getElementById('srch').value.toLowerCase();
  const list=STAFF.filter(s=>s.name.toLowerCase().includes(q)||s.dept.toLowerCase().includes(q));
  document.getElementById('grid').innerHTML=list.map(s=>{
    const st=att[s.id]||'',lt=late[s.id]||'';
    return `<div class="sc${st?' mk-'+st:''}">
      <div class="av" style="background:${s.c};color:${s.t}">${ini(s.name)}</div>
      <div class="si">
        <div class="sn">${s.name}</div>
        <div class="sd">${s.dept}</div>
        ${st==='L'&&lt?`<div class="lt">&#9200; ${lt}</div>`:''}
      </div>
      <div class="bg">
        <button class="ab${st==='P'?' sP':''}" onclick="mark(${s.id},'P')">P</button>
        <button class="ab${st==='A'?' sA':''}" onclick="mark(${s.id},'A')">A</button>
        <button class="ab${st==='L'?' sL':''}" onclick="mark(${s.id},'L')">L</button>
        <button class="ab${st==='H'?' sH':''}" onclick="mark(${s.id},'H')">H</button>
      </div>
    </div>`;
  }).join('');
}

function mark(id,st){
  if(st==='L'){
    if(att[id]==='L'){delete att[id];delete late[id];renderStats();renderGrid();return}
    pendingLateId=id;
    document.getElementById('lateFor').textContent=STAFF.find(s=>s.id===id).name+' — entry time?';
    document.getElementById('lateInp').value=late[id]||'';
    document.getElementById('latePop').style.display='flex';
    setTimeout(()=>document.getElementById('lateInp').focus(),100);
    return;
  }
  att[id]=att[id]===st?'':st;
  if(att[id]!=='L')delete late[id];
  renderStats();renderGrid();
}
function markAll(s){STAFF.forEach(x=>{att[x.id]=s;if(s!=='L')delete late[x.id]});renderStats();renderGrid()}
function confirmLate(){
  const t=document.getElementById('lateInp').value.trim();
  if(t&&!/^\d{1,2}:\d{2}$/.test(t)){alert('Format: HH:MM  e.g. 10:35');return}
  att[pendingLateId]='L';late[pendingLateId]=t||'';
  document.getElementById('latePop').style.display='none';
  pendingLateId=null;renderStats();renderGrid();
}
function cancelLate(){
  document.getElementById('latePop').style.display='none';
  pendingLateId=null;
}

// ── SAVE ──
async function doSave(){
  const unm=STAFF.filter(s=>!att[s.id]);
  if(unm.length>0){
    const w=document.getElementById('warnMsg');
    w.style.display='block';
    w.textContent=unm.length+' unmarked: '+unm.slice(0,3).map(s=>s.name).join(', ')+(unm.length>3?'...':'');
    setTimeout(()=>{w.style.display='none'},4000);
    document.getElementById('srch').value='';renderGrid();
    return;
  }
  const k=curKey();
  const db=getDB();
  if(db[k]&&!editConfirmed){
    const w=document.getElementById('warnMsg');
    w.style.display='block';
    w.innerHTML='Already saved! <button onclick="forceEdit()" style="background:#dc2626;color:#fff;border:none;border-radius:6px;padding:2px 10px;font-size:12px;font-weight:700;cursor:pointer">Save Anyway</button>';
    return;
  }
  editConfirmed=false;
  const savedAt=fmtTimeNow();
  db[k]={date:k,label:fmtKey(k),savedAt,att:{...att},late:{...late},phones};
  saveDB(db);
  document.getElementById('warnMsg').style.display='none';
  toast('Saved!');
  setLoad(true);
  try{
    const records=STAFF.map(s=>({date:k,staffId:s.id,name:s.name,dept:s.dept,status:att[s.id]||'',lateTime:late[s.id]||'',savedAt,phones}));
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',records,phones,date:k})});
  }catch(e){}
  setLoad(false);
}
function forceEdit(){editConfirmed=true;document.getElementById('warnMsg').style.display='none';doSave()}

// ── SYNC ──
function syncFromSheets(){
  setLoad(true);
  const old=document.getElementById('gs_sc');
  if(old)old.remove();
  const cb='gscb'+Date.now();
  const timer=setTimeout(()=>{
    delete window[cb];const s=document.getElementById('gs_sc');if(s)s.remove();
    setLoad(false);toast('Sync timeout - check internet');
  },12000);
  window[cb]=function(json){
    clearTimeout(timer);delete window[cb];
    const s=document.getElementById('gs_sc');if(s)s.remove();
    setLoad(false);
    try{
      if(!json||json.status!=='success'||!json.data||json.data.length<2){toast('No data yet');return}
      const rows=json.data.slice(1);
      const db=getDB();
      rows.forEach(row=>{
        const rawDate=String(row[0]||'').trim();
        if(!rawDate||rawDate==='DATE')return;
        // Parse date - handle multiple formats
        let date=rawDate;
        if(rawDate.includes('/')){
          const p=rawDate.split('/');
          if(p.length===3&&p[2].length===4){
            // DD/MM/YYYY format from Google Sheets display
            date=p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');
          }
        } else if(rawDate.includes('T')||rawDate.includes('Z')){
          // ISO format - convert UTC to IST (+5:30)
          const d=new Date(rawDate);
          const ist=new Date(d.getTime()+(5.5*60*60*1000));
          date=ist.toISOString().slice(0,10);
        } else if(rawDate.length>10){
          date=rawDate.slice(0,10);
        }
        if(!date||date.length!==10||!date.match(/^\d{4}-\d{2}-\d{2}$/))return;
        const staffId=parseInt(row[1]);
        if(!staffId||staffId===0)return;
        const status=String(row[4]||'').trim();
        // Clean late time - only HH:MM format valid
        const rawLate=String(row[5]||'').trim();
        const lateTime=/^\d{1,2}:\d{2}$/.test(rawLate)?rawLate:'';
        // Clean savedAt - filter 1899
        const rawSaved=String(row[6]||'').trim();
        const savedAt=rawSaved.includes('1899')||rawSaved.includes('T')?'':rawSaved;
        const ph=parseInt(row[7])||0;
        if(!db[date]){
          db[date]={date,label:fmtKey(date),savedAt,att:{},late:{},phones:ph};
        }
        if(status)db[date].att[staffId]=status;
        if(lateTime)db[date].late[staffId]=lateTime;
        if(ph>0)db[date].phones=ph;
        if(savedAt&&!db[date].savedAt)db[date].savedAt=savedAt;
      });
      saveDB(db);
      loadCurDate();
      toast('Synced!');
    }catch(e){toast('Sync error')}
  };
  const sc=document.createElement('script');
  sc.id='gs_sc';
  sc.src=SCRIPT_URL+'?action=get&callback='+cb+'&t='+Date.now();
  sc.onerror=()=>{clearTimeout(timer);delete window[cb];setLoad(false);toast('Sync failed')};
  document.head.appendChild(sc);
}

// ── REPORTS ──
function openReports(){switchTab(curTab);openM('repMod')}
function switchTab(tab){
  curTab=tab;
  document.getElementById('tab-day').classList.toggle('active',tab==='day');
  document.getElementById('tab-month').classList.toggle('active',tab==='month');
  document.getElementById('tab-day-content').style.display=tab==='day'?'block':'none';
  document.getElementById('tab-month-content').style.display=tab==='month'?'block':'none';
  if(tab==='day')renderDayList();else renderMonthList();
}

function cleanSavedAt(s){
  if(!s)return '';
  const str=String(s);
  if(str.includes('1899')||str.includes('T')||str.length>20)return '';
  return str;
}

function renderDayList(){
  const db=getDB();
  const keys=Object.keys(db).sort().reverse();
  const el=document.getElementById('tab-day-content');
  if(!keys.length){el.innerHTML='<div class="empty">No records yet</div>';return}
  el.innerHTML=keys.map(k=>{
    const r=db[k];
    const c={P:0,A:0,L:0,H:0};
    Object.values(r.att||{}).forEach(v=>{if(c[v]!==undefined)c[v]++});
    const sv=cleanSavedAt(r.savedAt);
    return`<div class="rc" onclick="openDay('${k}')">
      <div class="rc-title">${r.label||k}</div>
      <div class="rc-sub">${sv?'Saved: '+sv:''} &nbsp;&#183;&nbsp; ${r.phones||0} phones</div>
      <div class="pills">
        <span class="pill pp">P: ${c.P}</span>
        <span class="pill pa">A: ${c.A}</span>
        <span class="pill pl">L: ${c.L}</span>
        <span class="pill ph2">H: ${c.H}</span>
      </div>
    </div>`;
  }).join('');
}

function renderMonthList(){
  const db=getDB();
  const keys=Object.keys(db).sort();
  const months={};
  keys.forEach(k=>{const m=k.slice(0,7);if(!months[m])months[m]=[];months[m].push(k)});
  const el=document.getElementById('tab-month-content');
  if(!Object.keys(months).length){el.innerHTML='<div class="empty">No records yet</div>';return}
  el.innerHTML=Object.keys(months).reverse().map(m=>{
    const [y,mo]=m.split('-');
    const label=new Date(y,mo-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
    const days=months[m];
    const c={P:0,A:0,L:0,H:0};
    days.forEach(d=>{Object.values(db[d].att||{}).forEach(v=>{if(c[v]!==undefined)c[v]++})});
    return`<div class="rc">
      <div class="rc-title">${label}</div>
      <div class="rc-sub">${days.length} days recorded</div>
      <div class="pills">
        <span class="pill pp">P: ${c.P}</span>
        <span class="pill pa">A: ${c.A}</span>
        <span class="pill pl">L: ${c.L}</span>
        <span class="pill ph2">H: ${c.H}</span>
      </div>
      <button class="month-dl-btn" onclick="event.stopPropagation();pdfMonth('${m}')">Download Monthly PDF</button>
    </div>`;
  }).join('');
}
